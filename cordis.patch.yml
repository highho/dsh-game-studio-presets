          config:
            sampleOverCapGlobResults: false
        - id: tool-jobs
          name: '@deepseek-ai/dsh-tool-jobs'
        - id: skill-filesystem
          name: '@deepseek-ai/dsh-skill-filesystem'
          config:
            customSkillDirs:
              - !!js (process.env.DSH_GAME_SKILLS || (process.env.USERPROFILE || process.env.HOME) + '/.dsh/game-studio-skills') + '/core'
              - !!js (process.env.DSH_GAME_SKILLS || (process.env.USERPROFILE || process.env.HOME) + '/.dsh/game-studio-skills') + '/build'
        - id: tool-skill
          name: '@deepseek-ai/dsh-tool-skill'
        - id: tool-todo
          name: '@deepseek-ai/dsh-tool-todo'
          config:
            allowParallelInProgress: true
        - id: tool-ask-user
          name: '@deepseek-ai/dsh-tool-ask-user'
        - id: compaction
          name: cordis:group
          group: true
          isolate:
            compaction: true
            toolResultPruner: true
          config:
            - id: compaction-basic
              name: '@deepseek-ai/dsh-compaction-basic'
              config:
                thresholdRatio: 0.8
